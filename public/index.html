<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Kitchen Ops | Recipe Library</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dishes.css" />
</head>

<body>
<a
  href="/add-recipe.html"
  class="add-recipe-button"
  aria-label="Add recipe"
  title="Add recipe"
>
  +
</a>
  <main class="dish-board minimal-board">
    <section class="dish-search-panel minimal-search" aria-label="Dish search">
      <div class="dish-search-control">
        <input
          id="dish-search"
          type="search"
          placeholder="Search"
          aria-label="Search recipes"
          autocomplete="off"
          autofocus
        />
        <button id="clear-dish-search" class="dish-search-clear" type="button"
          aria-label="Clear search" title="Clear search" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <p id="dish-count" class="dish-count" hidden></p>
    </section>

    <section
      id="dish-list"
      class="dish-list"
      aria-label="Dish list"
    ></section>

    <p id="no-results" class="no-results" hidden>
      No matching dishes found.
    </p>
    <p id="recipe-library-status" class="recipe-library-status" role="status" hidden></p>
  </main>

  <dialog id="delete-recipe-dialog" class="recipe-delete-dialog"
    aria-labelledby="delete-recipe-title" aria-describedby="delete-recipe-description">
    <form id="delete-recipe-form">
      <h2 id="delete-recipe-title">Delete recipe?</h2>
      <p id="delete-recipe-description">Are you sure you want to delete <strong id="delete-recipe-name"></strong>?
        Its ingredients and method will also be deleted. This cannot be undone.</p>
      <p id="delete-recipe-error" class="recipe-delete-error" role="alert" hidden></p>
      <div class="recipe-delete-dialog-actions">
        <button id="cancel-recipe-delete" class="recipe-edit-link" type="button" autofocus>Cancel</button>
        <button id="confirm-recipe-delete" class="recipe-delete-confirm" type="submit">Delete recipe</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/dishes.js"></script>
</body>
</html>
