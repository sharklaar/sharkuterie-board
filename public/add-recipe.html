<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Add Recipe</title>

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/dishes.css" />
  <link rel="stylesheet" href="/css/add-recipe.css" />
</head>

<body>

  <main class="recipe-form-page">
    <h1>Add Recipe</h1>

    <form id="recipe-form">

      <label>
        Recipe name
        <input
          type="text"
          name="name"
          required
        />
      </label>

      <label>
        Description
        <textarea
          name="description"
          rows="4"
        ></textarea>
      </label>

      <label>
        Serves
        <input
          type="text"
          name="serves"
          placeholder="e.g. 4 or 10–12"
        />
      </label>

      <label>
        Heat level
        <input
          type="number"
          name="heat_level"
          min="0"
          max="10"
          step="0.5"
        />
      </label>

      <label>
        Total time (minutes)
        <input
          type="number"
          name="total_time_minutes"
          min="0"
        />
      </label>

      <button type="submit">
        Save recipe
      </button>

    </form>

    <p>
      <a href="/">Cancel</a>
    </p>
  </main>

  <p id="form-status" role="status"></p>
<script src="/js/add-recipe.js"></script>
</body>
</html>
