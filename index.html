<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>The Sharkuterie Board</title>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dishes.css" />
</head>

<body>
  <main class="dish-board minimal-board">
    <section class="dish-search-panel minimal-search" aria-label="Dish search">
      <input
        id="dish-search"
        type="search"
        placeholder="Search"
        autocomplete="off"
        autofocus
      />
      <p id="dish-count" class="dish-count" hidden></p>
    </section>

    <section
      id="dish-list"
      class="dish-list"
      aria-label="Dish list"
    ></section>

    <p id="no-results" class="no-results" hidden>
      No matching dishes found.
    </p>
  </main>

  <script src="js/dishes.js"></script>
</body>
</html>
